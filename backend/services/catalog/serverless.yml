service: truequi-catalog

provider:
  name: aws
  runtime: python3.9
  region: us-east-1
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:Scan
      Resource: "arn:aws:dynamodb:us-east-1:*:table/Productos"
    - Effect: Allow
      Action:
        - s3:PutObject
      Resource: "arn:aws:s3:::truequi-images-bucket/*"

functions:
  crearProducto:
    handler: handler.crear_producto
    events:
      - http:
          path: /productos
          method: post
          cors: true
  obtenerProductos:
    handler: handler.obtener_productos
    events:
      - http:
          path: /productos
          method: get
          cors: true
  obtenerUploadUrl:
    handler: handler.obtener_upload_url
    events:
      - http:
          path: /productos/upload-url
          method: get
          cors: true
  healthCheck:
    handler: handler.health_check
    events:
      - http:
          path: /health
          method: get
          cors: true