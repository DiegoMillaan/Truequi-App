service: truequi-catalog

useDotenv: true

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  environment:
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASS: ${env:DB_PASS}
    DB_NAME: ${env:DB_NAME}
    BUCKET_NAME: truequi-images-dm2026
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Scan
        - dynamodb:Query
      Resource: 
        - "arn:aws:dynamodb:us-east-1:*:table/Productos"
        - "arn:aws:dynamodb:us-east-1:*:table/Productos/index/*"
        - "arn:aws:dynamodb:us-east-1:*:table/Mensajes"
        - "arn:aws:dynamodb:us-east-1:*:table/Mensajes/index/*"
        - "arn:aws:dynamodb:us-east-1:*:table/Usuarios"
    - Effect: Allow
      Action:
        - s3:PutObject
      Resource: "arn:aws:s3:::truequi-images-dm2026/*"

functions:
  crearProducto:
    handler: handler.crear_producto
    events:
      - http:
          path: /productos
          method: post
          cors: true
  obtenerProductos:
    handler: handler.obtener_productos
    events:
      - http:
          path: /productos
          method: get
          cors: true
  eliminarProducto:
    handler: handler.eliminar_producto
    events:
      - http:
          path: /productos/{id}
          method: delete
          cors: true
  obtenerUploadUrl:
    handler: handler.obtener_upload_url
    events:
      - http:
          path: /productos/upload-url
          method: get
          cors: true
  obtenerPerfil:
    handler: handler.obtener_perfil
    events:
      - http:
          path: /usuario/perfil/{id}
          method: get
          cors: true
  actualizarPerfil:
    handler: handler.actualizar_perfil
    events:
      - http:
          path: /usuario/perfil
          method: put
          cors: true
  crearMensaje:
    handler: handler.crear_mensaje
    events:
      - http:
          path: /mensajes
          method: post
          cors: true
  obtenerMensajes:
    handler: handler.obtener_mensajes
    events:
      - http:
          path: /mensajes
          method: get
          cors: true
  actualizarEstadoMensaje:
    handler: handler.actualizar_estado_mensaje
    events:
      - http:
          path: /mensajes/{id}
          method: put
          cors: true

resources:
  Resources:
    ProductosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Productos
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: vendedorId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: VendedorIndex
            KeySchema:
              - AttributeName: vendedorId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    MensajesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Mensajes
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: destinatario
            AttributeType: S
          - AttributeName: remitente
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: DestinatarioIndex
            KeySchema:
              - AttributeName: destinatario
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: RemitenteIndex
            KeySchema:
              - AttributeName: remitente
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        
    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: truequi-images-dm2026
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, GET]
              AllowedOrigins: ['*']
              AllowedHeaders: ['*']
              
    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: ImagesBucket
        PolicyDocument:
          Statement:
            - Action: s3:GetObject
              Effect: Allow
              Resource: "arn:aws:s3:::truequi-images-dm2026/*"
              Principal: "*"

plugins:
  - serverless-python-requirements
  - serverless-offline