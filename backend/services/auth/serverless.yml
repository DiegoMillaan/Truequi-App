service: truequi-auth

useDotenv: true

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  environment:
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASS: ${env:DB_PASS}
    DB_NAME: ${env:DB_NAME}
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID}

functions:
  registroTradicional:
    handler: handler.registro_tradicional
    events:
      - http:
          path: /registro
          method: post
          cors: true
  loginGoogle:
    handler: handler.login_google
    events:
      - http:
          path: /login/google
          method: post
          cors: true
  loginTradicional:
    handler: handler.login_tradicional
    events:
      - http:
          path: /login
          method: post
          cors: true
  actualizarUsuario:
    handler: handler.actualizar_usuario
    events:
      - http:
          path: /usuario/actualizar
          method: put
          cors: true
  eliminarUsuario:
    handler: handler.eliminar_usuario
    events:
      - http:
          path: /usuario/eliminar
          method: delete
          cors: true
  healthCheck:
    handler: handler.health_check
    events:
      - http:
          path: /health
          method: get
          cors: true

plugins:
  - serverless-offline
  - serverless-python-requirements

custom:
  pythonRequirements: {}

package:
  patterns:
    - '!venv/**'
    - '!.serverless/**'